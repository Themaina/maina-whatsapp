name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Check tag matches plugin.json version
        run: |
          VERSION=$(php -r 'echo json_decode(file_get_contents("plugin.json"), true)["version"];')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then echo "plugin.json version $VERSION does not match tag $TAG"; exit 1; fi
          echo "SLUG=$(php -r 'echo explode("/", json_decode(file_get_contents("plugin.json"), true)["id"])[1];')" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: PHP syntax check
        run: find . -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Build zip
        run: git archive --format=zip --prefix="${SLUG}/" -o "${SLUG}-${VERSION}.zip" HEAD
      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${SLUG}-${VERSION}.zip" --clobber
